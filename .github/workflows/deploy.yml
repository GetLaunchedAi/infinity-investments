name: Build & Deploy to Cloudways

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm ci

      - name: Build Eleventy
        run: npx @11ty/eleventy

      - name: Add API relay to build output
        run: |
          mkdir -p public/api
          cp -f api/send-email.php public/api/send-email.php

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          local_path: ./public/*
          remote_path: /home/master/applications/${{ secrets.CLOUDWAYS_APP_ID }}/public_html
          sftp_only: true
          exclude: |
            .htaccess
